<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101526">
  <title>Contact — Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101526; color: #f7f7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; background: radial-gradient(ellipse at 15% 15%, #7358ff33 0, transparent 35%), radial-gradient(ellipse at 85% 85%, #19d3c533 0, transparent 35%), #101526; }
    .stars, .stars::before, .stars::after { position: fixed; inset: 0; pointer-events: none; content: ""; background-image: radial-gradient(2px 2px at 20px 30px, #ffffff88 50%, transparent 100%), radial-gradient(1px 1px at 90px 80px, #ffffff77 50%, transparent 100%), radial-gradient(1px 1px at 160px 140px, #ffffff66 50%, transparent 100%); background-size: 210px 190px; opacity: .42; }
    .stars::before { transform: translate(80px, 45px) scale(1.2); opacity: .45; } .stars::after { transform: translate(-45px, 110px) scale(.8); opacity: .35; }
    nav { position: fixed; top: 1.5rem; left: 50%; z-index: 2; display: flex; gap: .4rem; padding: .4rem; transform: translateX(-50%); border: 1px solid #ffffff20; border-radius: 999px; background: #11182acc; backdrop-filter: blur(12px); }
    nav a { padding: .65rem 1rem; border-radius: 999px; color: #c5cce0; font-size: .9rem; text-decoration: none; transition: background .2s, color .2s; }
    nav a:hover, nav a[aria-current="page"] { color: white; background: #ffffff18; }
    main { position: relative; width: min(90vw, 720px); margin: 7rem 0 3rem; padding: clamp(2.5rem, 8vw, 5rem); border: 1px solid #ffffff20; border-radius: 32px; background: linear-gradient(145deg, #ffffff12, #ffffff05); box-shadow: 0 30px 100px #0006, inset 0 1px #ffffff20; backdrop-filter: blur(18px); animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 .8rem; color: #b9c1d9; font-size: .76rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 5.5rem); line-height: 1; letter-spacing: -.075em; background: linear-gradient(100deg, #fff 15%, #d8d0ff 55%, #9cefe5); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .intro { margin: 1.5rem 0 0; color: #c1c9de; font-size: 1.15rem; line-height: 1.75; }
    .rule { width: 54px; height: 3px; margin: 2rem 0; border-radius: 9px; background: linear-gradient(90deg, #a58aff, #58e1d2); }
    .contact-card { display: flex; align-items: center; gap: 1rem; width: fit-content; padding: 1rem 1.25rem; border: 1px solid #ffffff20; border-radius: 16px; background: #ffffff09; color: #fff; text-decoration: none; transition: transform .2s, background .2s; }
    .contact-card:hover { transform: translateY(-3px); background: #ffffff12; }
    .icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: linear-gradient(135deg, #9b7bff, #4fdacb); font-size: 1.2rem; }
    .contact-card strong { display: block; margin-bottom: .2rem; }
    .contact-card span:last-child { color: #aab3cc; font-size: .92rem; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <p class="eyebrow">Have a thought to share?</p>
    <h1>Connect us.</h1>
    <p class="intro">Questions, ideas, or just stopping by to say hello? I’d love to hear from you.</p>
    <div class="rule" aria-hidden="true"></div>
    <a class="contact-card" href="mailto:hello@example.com">
      <span class="icon" aria-hidden="true">✉</span>
      <span><strong>Send an email</strong><span>hello@example.com</span></span>
    </a>
  </main>
</body>
</html>
