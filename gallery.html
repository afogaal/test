<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101526">
  <title>Gallery — Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101526; color: #f7f7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; background: radial-gradient(ellipse at 15% 15%, #7358ff33 0, transparent 35%), radial-gradient(ellipse at 85% 85%, #19d3c533 0, transparent 35%), #101526; }
    .stars, .stars::before, .stars::after { position: fixed; inset: 0; pointer-events: none; content: ""; background-image: radial-gradient(2px 2px at 20px 30px, #ffffff88 50%, transparent 100%), radial-gradient(1px 1px at 90px 80px, #ffffff77 50%, transparent 100%), radial-gradient(1px 1px at 160px 140px, #ffffff66 50%, transparent 100%); background-size: 210px 190px; opacity: .42; }
    .stars::before { transform: translate(80px, 45px) scale(1.2); opacity: .45; } .stars::after { transform: translate(-45px, 110px) scale(.8); opacity: .35; }
    nav { position: fixed; top: 1.5rem; left: 50%; z-index: 2; display: flex; gap: .4rem; padding: .4rem; transform: translateX(-50%); border: 1px solid #ffffff20; border-radius: 999px; background: #11182acc; backdrop-filter: blur(12px); }
    nav a { padding: .65rem 1rem; border-radius: 999px; color: #c5cce0; font-size: .9rem; text-decoration: none; transition: background .2s, color .2s; }
    nav a:hover, nav a[aria-current="page"] { color: white; background: #ffffff18; }
    main { position: relative; width: min(92vw, 960px); margin: 7rem 0 3rem; padding: clamp(2rem, 6vw, 4rem); border: 1px solid #ffffff20; border-radius: 32px; background: linear-gradient(145deg, #ffffff12, #ffffff05); box-shadow: 0 30px 100px #0006, inset 0 1px #ffffff20; backdrop-filter: blur(18px); animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 .8rem; color: #b9c1d9; font-size: .76rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 9vw, 5.5rem); line-height: 1; letter-spacing: -.075em; background: linear-gradient(100deg, #fff 15%, #d8d0ff 55%, #9cefe5); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .intro { margin: 1.2rem 0 2rem; color: #c1c9de; font-size: 1.1rem; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    figure { position: relative; min-height: 220px; margin: 0; overflow: hidden; display: flex; align-items: end; padding: 1.2rem; border: 1px solid #ffffff20; border-radius: 20px; background: var(--art); isolation: isolate; }
    figure::before { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(180deg, transparent 30%, #080b18cc); transition: transform .5s; }
    figure:hover::before { transform: scale(1.08); }
    figure:nth-child(1) { --art: radial-gradient(circle at 70% 35%, #fff8 0 2%, transparent 3%), radial-gradient(circle at 70% 35%, #ffe7a8 0 10%, transparent 11%), linear-gradient(145deg, #fd9b78, #624d99 60%, #172344); }
    figure:nth-child(2) { --art: radial-gradient(ellipse at 50% 85%, #8ef2d0 0 18%, transparent 19%), radial-gradient(ellipse at 30% 95%, #64bdb6 0 28%, transparent 29%), linear-gradient(155deg, #83d8e1, #3d698c 55%, #2c315a); }
    figure:nth-child(3) { --art: radial-gradient(circle at 50% 45%, #fff 0 1%, transparent 2%), radial-gradient(circle at 50% 45%, #b3a5ff 0 13%, transparent 14%), radial-gradient(circle at 20% 25%, #fff9 0 1px, transparent 2px), radial-gradient(circle at 80% 20%, #fff9 0 1px, transparent 2px), linear-gradient(150deg, #20376e, #13132f 70%); }
    figcaption { color: white; font-size: 1rem; font-weight: 650; letter-spacing: .01em; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } figure { min-height: 190px; } nav { gap: 0; } nav a { padding: .62rem .72rem; font-size: .82rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></nav>
  <main>
    <p class="eyebrow">A few little daydreams</p>
    <h1>Gallery</h1>
    <p class="intro">A tiny collection of colorful scenes, made entirely with CSS.</p>
    <section class="grid" aria-label="Gallery artwork">
      <figure><figcaption>Golden hour</figcaption></figure>
      <figure><figcaption>Quiet waters</figcaption></figure>
      <figure><figcaption>Somewhere beyond</figcaption></figure>
    </section>
  </main>
</body>
</html>
